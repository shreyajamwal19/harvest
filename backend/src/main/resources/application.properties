# Application
spring.application.name=harvest-backend
server.port=8080

# Database
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/harvest}
spring.datasource.username=${DB_USERNAME:shreyajamwal}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Logging
logging.level.com.harvest=INFO
logging.level.org.springframework.security=WARN

# JWT
# NOTE: default below is a DEV-ONLY fallback (>=512 bits, required by HS512) so the app
# never fails to sign tokens locally. Production MUST override via the JWT_SECRET env var
# with its own securely generated secret - see JwtUtil startup check.
jwt.secret=${JWT_SECRET:8GaUJ9Pc1PPpVqGcRwllwQPFXQqFU_i4wIB82RZojx91nz9xgLR8SfOZC1rFXiEqYe9eja50uN9yOfB2AaGFeQ}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Auth cookie (httpOnly JWT storage)
app.cookie.secure=${COOKIE_SECURE:false}
app.cookie.same-site=${COOKIE_SAME_SITE:Lax}

# CORS
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173,http://localhost:3000}
