# Application
spring.application.name=harvest-backend
server.port=8080

# Database
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/harvest}
spring.datasource.username=${DB_USERNAME:shreyajamwal}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA & Hibernate Basics
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Hibernate Batching Optimizations (Required for Food.com Importer)
spring.jpa.properties.hibernate.jdbc.batch_size=500
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.jdbc.batch_versioned_data=true
spring.jpa.properties.hibernate.generate_statistics=false

# Run data.sql after Hibernate creates/updates the schema (seeds the Local Recipe Provider)
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=never

# Logging
logging.level.com.harvest=INFO
logging.level.org.springframework.security=WARN

# JWT
# NOTE: default below is a DEV-ONLY fallback (>=512 bits, required by HS512) so the app
# never fails to sign tokens locally. Production MUST override via the JWT_SECRET env var
# with its own securely generated secret - see JwtUtil startup check.
jwt.secret=${JWT_SECRET:8GaUJ9Pc1PPpVqGcRwllwQPFXQqFU_i4wIB82RZojx91nz9xgLR8SfOZC1rFXiEqYe9eja50uN9yOfB2AaGFeQ}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Auth cookie (httpOnly JWT storage)
app.cookie.secure=${COOKIE_SECURE:false}
app.cookie.same-site=${COOKIE_SAME_SITE:Lax}

# CORS
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173,http://localhost:3000}

# Chef Brain request pipeline (Context Assembly -> Composition/Retrieval Planning ->
# Response Rendering -> Memory Write) is fully deterministic/rule-based - retrieval,
# ranking, and recipe content NEVER require an external LLM or API key.
#
# Phase 5A adds an optional AI Chef Reasoning Layer on top, purely to talk about
# already-retrieved/already-ranked recipes conversationally (compare options, explain
# trade-offs, answer follow-ups like "make it vegetarian"). It goes through a
# provider-agnostic LLMProviderManager with automatic failover, in this order:
#   1. Gemini (primary)
#   2. Groq (fallback #1)
#   3. OpenAI (fallback #2)
# Every provider is independently optional - if a given API key is unset, that
# provider reports itself unavailable and is skipped. If ALL three are unset (or all
# calls fail), the reasoning layer is disabled entirely and Chef Brain falls back to
# its existing deterministic summary messages - the app functions identically either way.
gemini.api-key=${GEMINI_API_KEY:}
gemini.model=${GEMINI_MODEL:gemini-2.0-flash}
gemini.max-tokens=${GEMINI_MAX_TOKENS:500}

groq.api-key=${GROQ_API_KEY:}
groq.model=${GROQ_MODEL:llama-3.3-70b-versatile}
groq.base-url=${GROQ_BASE_URL:https://api.groq.com/openai/v1/chat/completions}
groq.max-tokens=${GROQ_MAX_TOKENS:500}

openai.api-key=${OPENAI_API_KEY:}
openai.model=${OPENAI_MODEL:gpt-4o-mini}
openai.base-url=${OPENAI_BASE_URL:https://api.openai.com/v1/chat/completions}
openai.max-tokens=${OPENAI_MAX_TOKENS:500}


# External Recipe Provider - TheMealDB (no key required for the shared test key)
harvest.providers.mealdb.base-url=${MEALDB_BASE_URL:https://www.themealdb.com/api/json/v1/1}
harvest.providers.mealdb.enabled=${MEALDB_ENABLED:true}

# Nutrition Provider - USDA FoodData Central. NUTRITION_API_KEY must be set for
# nutrition grounding to work; if unset, the provider is skipped rather than
# guessing values (nutrition must never be hallucinated).
harvest.providers.nutrition.api-key=${NUTRITION_API_KEY:}
harvest.providers.nutrition.base-url=${NUTRITION_BASE_URL:https://api.nal.usda.gov/fdc/v1}

# ===================================================================
# FEATURE FLAGS
# ===================================================================

# Enable and trigger the Food.com dataset importer on startup
harvest.import.foodcom=false